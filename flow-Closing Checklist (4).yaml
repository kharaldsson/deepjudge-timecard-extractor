            **Item Details:**

              * **Description:** Buyer shall wire the Closing Payment to the account designated by Seller.
              * **Summary:** Wire Closing Payment
              * **Responsibility:** Buyer
              * **Context/Timing:** Closing
              * **Source Text:** "Section 3.2"

            **Assistant:**


