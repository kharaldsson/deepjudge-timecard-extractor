    - id: completion@SUFwmbAMCVa
      type: completion
      label: Extract Deliverable
      position:
        x: 270
        'y': 30
      group_size:
        width: 200
        height: 152
      subscope_heights: null
      options:
        prompt:
          default_prompt: >-
            Below is an excerpt from an agreement. Your task is to identify all
            explicit deliverables, obligations, and covenants within the
            text—covering those due at signing, between signing and closing, at
            closing, or any that are conditional or deviate from the standard
            agreement.


            Here is the excerpt:


            <AGREEMENT EXCERPT>

            {agreement}

            </AGREEMENT EXCERPT>
          specific_prompts: []
        truncation: truncate_middle
        json_schema: |-
          {
            "type": "object",
            "properties": {
              "deliverables": {
                "type": "array",
                "description": "An array of action/deliverables related to the transaction.",
                "items": {
                  "type": "object",
                  "properties": {
                    "action_deliverable": {
                      "type": "string",
                      "description": "Description of the action or deliverable."
                    },
                   "three_word_summary": {
                      "type": "string",
                      "description": "Three-word summary of action or deliverable."
                    },
                    "bucket": {
                      "type": "string",
                      "description": "Timing classification as Signing, Pre-Closing, Closing, Termination",
                      "enum": [ "Signing", "Pre-Closing", "Closing", "Termination"]
                    },
                    "document_section_reference": {
                      "type": "string",
                      "description": "Name (and number, if available) of the document section where the deliverable/action is referenced (e.g., 'Section 3.2: Seller Deliverables')."
                    },
                    "passage_id": {
                      "type": "string",
                      "description": "Passage ID from the excerpt markup (e.g., '[^54243]')."
                    },
                    "delivery_method": {
                      "type": "string",
                      "description": "Method of delivery for the action or deliverable."
                    },
                    "responsibility": {
                      "type": "string",
                      "description": "Entity responsible for the delivery."
                    },
                    "due_date": {
                      "type": "object",
                      "properties": {
                        "citation": {
                          "type": ["string"],
                          "description": "The citation mentioning the due date of the detected event (e.g. 'Deliver at Closing') ."
                        }
                      },
                      "required": [
                        "citation"
                      ],
                      "additionalProperties": false
                    }
                  },
                  "required": [
                    "action_deliverable",
                    "document_section_reference",
                    "passage_id",
                    "delivery_method",
                    "responsibility",
                    "due_date"
                  ],
                  "additionalProperties": false
                }
              }
            },
            "required": ["deliverables"],
            "additionalProperties": false
          }
        output_fomat: json
        system_prompt:
          default_prompt: "You are an expert M&A lawyer with decades of experience in transaction management. Your task is to analyze agreement excerpts and extract all explicit actionable items and deliverables for a Closing Checklist.\n\n# Core Selection Criteria (The \"Transaction Critical Path\" Test)\n\nTo decide if an item should be extracted, apply the following logic. The item must be a definite step required to consummate the transaction, not a hypothetical remedy.\n\n1. The \"Action Verb\" Filter\nLook for concrete actions that move the deal forward.\n- EXTRACT: Items using verbs like Deliver, Provide, Execute, Sign, File, Register, Transfer, Wire, Pay, Resign, Maintain, Comply, Notify, Seek, Obtain, and Refrain from.\n- EXTRACT \"The Seller shall deliver [Document X].\"\n- EXTRACT: \"The Company shall cause [Action Y] to occur.\"\n\n2. The \"Definite vs. Conditional\" Filter (Crucial)\nDistinguish between steps that must happen to consummate the transaction vs. actions that arise only as remedies if things go wrong.\n\n- INCLUDE (Definite): Procedural obligations that are part of the standard deal flow (e.g., \"Seller shall file the 8-K,\" \"Buyer shall transfer the Funds\").\n\n- INCLUDE (Pre-Closing Conditional Obligations): Extract actions that may be triggered by regulatory thresholds, laws, regulator or third-party requirements, or deal mechanics necessary to close.\n    * Examples: \n        - \"If required by Antitrust Laws, Buyer shall file the HSR notification.\"\n        - \"If any Consent is needed, Seller shall obtain such Third-Party Consents.\"\n        - \"If the SEC requests, Company shall amend and refile the Proxy Statement.\"\n        - \"If required by applicable Law, Parties shall register the Transaction with [Authority].\"\n\n- EXCLUDE (Post-Closing Remedies): Do not extract actions that arise only upon breach, dispute, termination, casualty, or indemnity claims, or that are remedial in nature rather than steps to close.\n    * Examples to Exclude:\n        - \"If a dispute arises, parties shall submit to arbitration.\"\n        - \"Seller shall indemnify Buyer for...\"\n        - \"Upon termination for breach, the non-breaching Party may seek specific performance or damages.\"\n\nDecision Rule:\n- Include if the condition is tied to pre-closing regulatory approvals, third-party consents, required filings, or other prerequisites to consummation.\n- Exclude if the condition is tied to disputes, breaches, remedies, indemnification, or other post-closing enforcement mechanics.\n\n# 3. The \"Reps & Warranties\" Nuance\n- Do Not Extract: pure statements of fact (e.g., \"Seller represents it is in good standing\").\n- EXTRACT: Any requirement to bring down or confirm the accuracy of representations at closing.\n- EXTRACT: Any obligation to update disclosure schedules or notify the other party of changes to representations, as these are critical interim checklist items (these are Pre-Closing Conditional Obligations if triggered by material changes or regulator/third-party requests).\n\n# Strict Exclusion Rules\n\n1.  Table of Contents (TOC): Do not extract items from the Table of Contents, indices, or section headings.\n2.  Past/Completed Items: Exclude actions that the text implies are already done (e.g., \"has delivered,\" \"receipt of which is hereby acknowledged\").\n3.  Recitals: Ignore background facts.\n4.  Post-Closing Remedies: Exclude actions that arise only due to breach/dispute/termination (e.g., arbitration commitments, indemnification obligations, liquidated damages).\n5.  Empty Result: If the excerpt contains no definite, actionable checklist items, return strictly: `{{\"deliverables\": []}}`.\n\n## Instructions for Extraction\n\n* Classify into Buckets:\n    * \"Signing\": Due at/immediately upon signing.\n    * \"Pre-Closing\": Due after signing but before closing.\n    * \"Closing\": Due at the moment of closing.\n    * \"Termination\": Related to termination rights/conditions.\n\n* JSON Output Structure:\n    Return a single JSON object with one key, `deliverables`.\n\n\n## Output Format:\n\nYour answer must be a single JSON object with one key, `deliverables`, holding an array of deliverable objects:\n\n````\n\n{{\n\_ \"deliverables\": [\n\_ \_ {{\n\_ \_ \_ \"action\\_deliverable\": \"Brief description of the action, deliverable, or covenant.\",\n\_ \_ \_ \"three\\_word\\_summary\": \"Three-word summary of action or deliverable.\",\n\_ \_ \_ \"bucket\": \"Signing / Pre-Closing / Closing / Termination\",\n\_ \_ \_ \"document\\_section\\_reference\": \"Section name/number (if available).\",\n\_ \_ \_ \"passage\\_id\": \"Input passage ID.\",\n\_ \_ \_ \"responsibility\": \"Responsible entity.\",\n\_ \_ \_ \"due\\_date\": {{\n\_ \_ \_ \_ \"citation\": \"Citation to the input text defining timing\",\n\_ \_ \_ }},\n\_ \_ \_ \"delivery\\_method\": \"Method of delivery (or 'Not Specified').\"\n\_ \_ }}\n\_ ]\n}}\n\n```\n\n- Only include items present in the excerpt.\n- Classify each item clearly in the `bucket` field.\n- Make sure each extracted item precisely matches the information stated in the input."
          specific_prompts: []
        multishot_prompt: []
        disable_truncation_warning: false
      variadic_config:
        input:
          - key: _ospIoEi
            name: agreement
      parent:
        node: map@X0EGhsnw953
        scope:
          key: body
          variadic_key: null
      constant_inputs:
