          '---------------').join('|') + "|";


          let data_string = "";

          let docx_data_string = "";  // without reference ID



          let csv_string = {rows: []}; // input.markdown_table.data


          for (row in input.markdown_table.data) {
            let rowData = input.markdown_table.data[row].data;
            let bucket = rowData[1].data;
