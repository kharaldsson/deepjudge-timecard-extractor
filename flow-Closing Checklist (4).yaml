    - id: javascript@LAZDbtFz2Ff
      type: javascript
      label: Separate the buckets
      position:
        x: 2115
        'y': 405
      group_size:
        width: 200
        height: 313
      subscope_heights: null
      options:
        code: |+
          const deliverables = input.deliverables.data;
          let signing = {type: "List", data: []};
          let closing = {type: "List", data: []};
          let preClosing = {type: "List", data: []};
          let termination = {type: "List", data: []};

          deliverables.forEach(item => {
              const bucket = JSON.parse(item.data).bucket;
              let temp = JSON.parse(item.data);
              item.data = JSON.stringify(temp);

              if (bucket === "Signing") {
                  signing.data.push(item);
              } else if (bucket === "Pre-Closing") {
                  preClosing.data.push(item);
              } else if (bucket === "Closing") {
                  closing.data.push(item);
              }  else if (bucket === "Termination") {
                  termination.data.push(item);
              }
          });


      variadic_config:
        input_values:
          - key: _X_2y
            name: deliverables
        output_values:
