          // =============== COMMON DATA UNWRAPPING UTILS =================


          function buildString(element) {
            return {
              type: "String",
              data: element
            }
          }

          const _headers = [
            "three_word_summary",
            "bucket",
            "action_deliverable",
            "document_section_reference",
