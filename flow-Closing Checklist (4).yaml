          rows.forEach(line => {
            let d = line;

            let mdVals = []

            for (let key of _headers) {
                  mdVals.push(buildString(d[key] || ""));
            }

            // Adding the Timing reference in the table
            mdVals.push(buildString((d.due_date.citation)));

            markdownDataRows.push(
               {
                 type: "List",
                 data: mdVals
               }
            )
          });

          const output_headers = _headers.map(key => buildString(key))

          const markdown_table = {
            type: "List",
            data: markdownDataRows
          };


      variadic_config:
