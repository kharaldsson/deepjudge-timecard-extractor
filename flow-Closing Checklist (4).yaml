    - id: javascript@rY8MpjSJuqG
      type: javascript
      label: Format the deliverables
      position:
        x: 3225
        'y': 585
      group_size:
        width: 200
        height: 331
      subscope_heights: null
      options:
        code: |-
          let chunks = input.chunks.data;
          const passageIdToIdxMap = chunks.reduce((acc, item) => {
            acc[item.source_id] = item.file_start_idx;
            return acc;
          }, {});


          let all_deliverables = [];

          input.deliverables.data.forEach(obj => {
              all_deliverables.push(JSON.parse(obj.data));
          });



          all_deliverables.forEach(deliverable => {
                 const passage_id = deliverable.passage_id;
                 if (!passage_id) { return { ...{position: -1} , ...deliverable }; }
                 const num = Number(passage_id.match(/\d+/)[0]);
                 return { ...{position: passageIdToIdxMap[num]} , ...deliverable };;
          });
          all_deliverables.sort((a, b) => a.position - b.position);
          let output = [];
          all_deliverables.forEach(deliverable => {
                 output.push({ type: "String", data: JSON.stringify(deliverable) });
          });

          const key_events = {
            type: "List",
            data: output
          };
      variadic_config:
        input_values:
          - key: _JcDN
            name: deliverables
          - key: _ji_H
            name: chunks
        output_values:
          - key: _E_HV
            name: key_events
      parent: null
      constant_inputs: {}
      generic_args: null
