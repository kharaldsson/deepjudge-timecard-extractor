      options:
        code: >
          /*

          // How to get inputs:

          const myVal = input.myInputName.data;


          // How to set outputs:

          const myOutputName = {type: 'String', data: 'Hello World' };

          */

          /*

          // How to get inputs:

          const myVal = input.myInputName.data;


          // How to set outputs:

          const myOutputName = {type: 'String', data: 'Hello World' };

          */


          // 0) Read and normalize input

          var raw = (input && input.myInputName && typeof input.myInputName.data
          === 'string')
            ? input.myInputName.data
            : '';

          function stripBOM(s) { return (s && s.charCodeAt(0) === 0xFEFF) ?
          s.slice(1) : s; }

          function norm(s) { return String(s || '').replace(/\r/g, ''); }


          raw = norm(stripBOM(raw));


          // 1) Split lines and parse header

          var lines = raw.split('\n').filter(function (ln) { return ln.trim()
          !== ''; });

          var headerLine = lines.length ? lines[0].trim() : '';

          var dataLines = lines.slice(1);


          var headers = headerLine.split(',').map(function (h) { return
          h.trim(); }).filter(Boolean);


          // 2) Build column arrays (all strings)

          var out = { headers: headers.slice() }; // copy preserves order

          for (var h = 0; h < headers.length; h++) {
            out[headers[h]] = [];
          }


          // 3) Fill columns from rows

          for (var i = 0; i < dataLines.length; i++) {
            var fields = dataLines[i].split(',').map(function (x) { return x.trim(); });
            // Ensure field count alignment; pad missing with empty string
            for (var j = 0; j < headers.length; j++) {
              var cell = (j < fields.length) ? fields[j] : '';
              out[headers[j]].push(String(cell));
            }
          }


          // 4) Emit a single String output with only strings inside the JSON

          const columnarJson = { type: 'String', data: JSON.stringify(out) };
      variadic_config:
