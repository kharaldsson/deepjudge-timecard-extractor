    - id: javascript@mR8HhRJKRIO
      type: javascript
      label: JS Create Markdown Table
      position:
        x: 1230
        'y': -465
      group_size:
        width: 200
        height: 198
      subscope_heights: null
      options:
        code: >
          /*

          // How to get inputs:

          const myVal = input.myInputName.data;


          // How to set outputs:

          const myOutputName = {type: 'String', data: 'Hello World' };

          */


          // 0) Read input JSON string

          var jsonStr = (input && input.myInputName && typeof
          input.myInputName.data === 'string')
            ? input.myInputName.data
            : '';

          // 1) Parse safely

          var obj;

          try {
            obj = JSON.parse(jsonStr);
          } catch (e) {
            // Fallback empty table if parse fails
            obj = { headers: [], };
          }


          // 2) Validate shape

          var headers = Array.isArray(obj.headers) ? obj.headers.slice() : [];

          // Ensure each header key exists as an array; if missing, create empty
          arrays

          for (var i = 0; i < headers.length; i++) {
            var h = headers[i];
            if (!Array.isArray(obj[h])) obj[h] = [];
          }


          // Determine row count from the longest column (or 0)

          var rowCount = 0;

          for (var k = 0; k < headers.length; k++) {
            var colLen = Array.isArray(obj[headers[k]]) ? obj[headers[k]].length : 0;
            if (colLen > rowCount) rowCount = colLen;
          }


          // 3) Escape helpers for Markdown table cells

          function escapeCell(s) {
            // Coerce to string, escape pipes and backticks, replace CR/LF with spaces
            var t = String(s == null ? '' : s);
            t = t.replace(/\r?\n/g, ' ');
            t = t.replace(/\|/g, '\\|');  // escape pipe
            t = t.replace(/`/g, '\\`');   // escape backtick
            return t;
          }


          // 4) Build Markdown table

          function makeHeaderLine(cols) {
            return '| ' + cols.map(function (c) { return escapeCell(c); }).join(' | ') + ' |';
          }

          function makeSeparatorLine(cols) {
            return '| ' + cols.map(function () { return '---'; }).join(' | ') + ' |';
          }

          function makeRowLine(index) {
            var cells = headers.map(function (h) {
              var col = obj[h] || [];
              var v = (index < col.length) ? col[index] : '';
              return escapeCell(v);
            });
            return '| ' + cells.join(' | ') + ' |';
          }


          var lines = [];

          if (headers.length > 0) {
            lines.push(makeHeaderLine(headers));
            lines.push(makeSeparatorLine(headers));
            for (var r = 0; r < rowCount; r++) {
              lines.push(makeRowLine(r));
            }
          }


          // 5) Emit as an additional constant (String-typed)

          const markdownTable = { type: 'String', data: lines.join('\n') };


          // Optional: expose line-by-line list with typed strings

          const markdownLines = {
            type: 'List',
            data: lines.map(function (ln) { return { type: 'String', data: ln }; })
          };


          // Optional: row count for diagnostics

          const markdownRowCount = { type: 'Number', data: rowCount };
      variadic_config:
        input_values:
          - key: _zRAu
            name: myInputName
        output_values:
          - key: _7XUe
            name: markdownTable
          - key: _EnoE
            name: markdownLines
          - key: _lAO-
            name: markdownRowCount
